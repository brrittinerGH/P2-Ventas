<section class="home-container">
  <div class="home-header">
    <h1>Sistema de Gestión Sucursales</h1>
    
    <p class="subtitulo">{{ subtitulo() }}</p>
  </div>

  <div class="home-grid">
    @for (o of visibles(); track o.ruta) {
      <a class="home-card" [routerLink]="o.ruta">
        <h3>{{ o.titulo }}</h3>
        <p>{{ o.texto }}</p>
      </a>
    }
  </div>
</section>
