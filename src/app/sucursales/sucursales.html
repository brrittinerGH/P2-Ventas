<section class="branches-container">
    <!-- Encabezado de la Sección -->
    <div class="branches-header">
      <h2>Nuestras Sucursales</h2>
      <p>Visualiza y administra la información de las sedes operativas de la empresa.</p>
    </div>
  
    <!-- Contenedor de Tarjetas (Grid) -->
    <div class="branches-grid">
      <!-- 1. Usamos idSucursal para el identificador único -->
      @for (s of suc(); track s.idSucursal) {
        <div class="branch-card">
                      
          <!-- Detalle Principal -->
          <div class="branch-info">
            <div class="info-icon">📍</div>
            <div class="info-text">
              <!-- 2. Mostramos el nombre de la sucursal -->
              <h3>Sucursal {{ s.nombre }}</h3>
              <!-- 3. Mostramos la dirección -->
              <p class="address">{{ s.direccion }}</p>
            </div>
          </div>
  
          <!-- Métrica de Empleados -->
          <div class="branch-meta">
            <div class="meta-item">
              <span class="meta-icon">👥</span>
              <span class="meta-label">Personal:</span>
              <!-- 4. Mostramos la cantidad de empleados -->
              <span class="meta-value">{{ s.cantempleado }} Empleados</span>
            </div>
          </div>
          
        </div>
      }
    </div>
  </section>
