<header class="main-header">
  <div class="header-container">
    <div class="brand">
      <h1>Portal de Gestión</h1>
    </div>

    <nav class="nav-menu">
      <button routerLink="/home" class="nav-btn" routerLinkActive="active-link">Home</button>
      <button routerLink="/sucursales" class="nav-btn" routerLinkActive="active-link">Sucursales</button>

      @if (auth.esAdmin() || auth.esVendedor()) {
        <button routerLink="/ventas" class="nav-btn" routerLinkActive="active-link">Ventas</button>
        <button routerLink="/clientes" class="nav-btn" routerLinkActive="active-link">Clientes</button>
        <button routerLink="/facturas" class="nav-btn" routerLinkActive="active-link">Facturas</button>
      }
      @if (auth.esAdmin()) {
        <button routerLink="/usuarios" class="nav-btn" routerLinkActive="active-link">Usuarios</button>
      }
      @if (auth.logueado()) {
        <button class="nav-btn" (click)="salir()">Salir</button>
                <span class="usuario-activo">{{ auth.usuario() }} ({{ auth.rol() }})</span>

      } @else {
        <button routerLink="/login" class="nav-btn" routerLinkActive="active-link">Login</button>
      }
    </nav>

    <app-reloj></app-reloj>
  </div>
</header>

<main class="content-wrapper">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
